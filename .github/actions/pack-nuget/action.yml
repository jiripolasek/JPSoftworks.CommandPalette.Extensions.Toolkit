name: 'Pack NuGet'
author: 'Jiri Polasek'
description: >-
  Pack the configured project or solution into artifacts/.
  
inputs:
  projectPath:
    description: "Path to the project or solution file"
    required: true
  version:
    description: "Version"
    required: true
  workspace:
    description: "github.workspace (path to repo root)"
    required: true
  configuration:
    description: "Build configuration (e.g. Release, Debug)"
    default: "Release"

outputs:
  nupkg-paths:
    description: "Semicolon-separated paths to the created NuGet packages"
    value: ${{ steps.pack.outputs.nupkg-paths }}
  snupkg-paths:
    description: "Semicolon-separated paths to the created symbol packages"
    value: ${{ steps.pack.outputs.snupkg-paths }}
  version:
    description: "Package version"
    value: ${{ steps.pack.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Pack
      id: pack
      shell: pwsh
      run: |
        $actionDir = "${{ github.action_path }}"
        & "$actionDir/pack.ps1" `
          -ProjectPath     '${{ inputs.projectPath }}' `
          -Version         '${{ inputs.version }}' `
          -Workspace       '${{ inputs.workspace }}' `
          -Configuration   '${{ inputs.configuration }}'
