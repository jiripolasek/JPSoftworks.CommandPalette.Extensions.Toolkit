name: Set up Toolkit .NET SDKs
description: Install the SDKs used by the lock files and both test runtimes.
inputs:
  cache-scope:
    description: Separate NuGet cache for the build job or an AOT runtime; empty disables caching.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          9.0.318
          10.0.400
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/toolkit-dotnet
    - name: Verify SDK selection
      shell: pwsh
      run: |
        $version = dotnet --version
        if ($LASTEXITCODE -ne 0 -or $version -ne '10.0.400') {
          throw "Expected .NET SDK 10.0.400; selected '$version'."
        }
    - name: Set NuGet packages folder
      if: inputs.cache-scope != ''
      shell: pwsh
      run: |
        if (-not $env:NUGET_PACKAGES) {
          "NUGET_PACKAGES=$env:GITHUB_WORKSPACE/artifacts/nuget" >> $env:GITHUB_ENV
        }
    - name: Cache NuGet packages
      if: inputs.cache-scope != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ hashFiles('.github/actions/setup-dotnet/action.yml', '**/packages.lock.json') }}
