name: Prepare package upload
description: Preserve the original packages and restore confirmed upload progress.
inputs:
  target:
    description: Publishing target, github or nuget.
    required: true
  version:
    description: Version of the downloaded package artifact.
    required: true
outputs:
  progress-path:
    description: Path to the confirmed upload progress for these packages.
    value: ${{ steps.state.outputs.progress-path }}
runs:
  using: composite
  steps:
    - name: Find the original upload snapshot in this run
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ github.token }}
        run-id: ${{ github.run_id }}
        pattern: upload-${{ inputs.target }}
        path: artifacts/upload-${{ inputs.target }}
        merge-multiple: true
    - name: Find confirmed uploads from earlier attempts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ github.token }}
        run-id: ${{ github.run_id }}
        pattern: upload-${{ inputs.target }}-progress-*
        path: artifacts/upload-${{ inputs.target }}-history
    - name: Restore packages and prepare upload progress
      id: state
      shell: pwsh
      env:
        PACKAGE_VERSION: ${{ inputs.version }}
        PUBLISH_TARGET: ${{ inputs.target }}
      run: |
        $state = ./eng/prepare-publish.ps1 -Version $env:PACKAGE_VERSION -Target $env:PUBLISH_TARGET
        "restored=$($state.Restored.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "progress-path=$($state.ProgressPath)" >> $env:GITHUB_OUTPUT
    - name: Save the original packages before uploading
      if: steps.state.outputs.restored == 'false'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: upload-${{ inputs.target }}
        path: artifacts/upload-${{ inputs.target }}
        if-no-files-found: error
        retention-days: 30
