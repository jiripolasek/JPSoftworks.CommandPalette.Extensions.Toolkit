name: CI • Build • Test • Pack & Deploy

# Triggers:
# - Build & test on master pushes and PRs
# - Release and publish on semantic-version tag pushes (e.g. v1.2.3)
# - Manual dispatch for flexibility
on:
  push:
    branches:
      - master
      - master-test
      - 'feature/**'
      - 'hotfix/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3'
        required: true
      release_notes:
        description: 'Release notes for the GitHub Release'
        required: false

permissions:
  contents: read
  packages: write
  actions: read

env:
  PackageName: JPSoftworks.CommandPalette.Extensions.Toolkit

jobs:

  # ----------------------------------------------
  # Build & Test
  # ----------------------------------------------
  build-test-pack:
    name: Build & Test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    env:
      SolutionName: JPSoftworks.CommandPalette.Extensions.Toolkit.slnx
      ProjectPath: JPSoftworks.CommandPalette.Extensions.Toolkit.slnx
      BuildConfiguration: Release

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Cache NuGet packages and build artifacts
        uses: actions/cache@v3
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/tools
            **/obj
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
          
      - name: Restore packages
        shell: pwsh
        run: |
          dotnet restore $env:SolutionName

      - name: Build
        shell: pwsh
        run: |
          dotnet build $env:SolutionName --configuration $env:BuildConfiguration --no-restore

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test $env:SolutionName --configuration $env:BuildConfiguration --no-build --no-restore

      - name: Verify x64 and ARM64 Native AOT and trimming
        shell: pwsh
        run: |
          & ./eng/verify-aot.ps1 -Configuration $env:BuildConfiguration
      
      - name: Get Version
        id: version
        uses: ./.github/actions/get-version
        with:
          github-event-name: ${{ github.event_name }}
          github-ref: ${{ github.ref }}
          version-override: ${{ github.event.inputs.version || '' }}

      - name: Pack to NuGet
        uses: ./.github/actions/pack-nuget
        with:
          projectPath:   ${{ env.ProjectPath }}
          version:       ${{ steps.version.outputs.version }}
          workspace:     ${{ github.workspace }}
          configuration: ${{ env.BuildConfiguration }}

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg          
          if-no-files-found: error
          path: artifacts/

  # ----------------------------------------------
  # Publish preview to GitHub Packages
  # ----------------------------------------------
  publish-preview:
    name: Publish Preview
    needs: build-test-pack
    if: startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Push packages to GitHub Packages
        shell: pwsh
        run: |
          Write-Host "Checking contents of artifacts folder"
          Get-ChildItem ./artifacts/*.nupkg -ErrorAction SilentlyContinue
          Get-ChildItem ./artifacts/*.snupkg -ErrorAction SilentlyContinue

          dotnet nuget push "artifacts\*.nupkg" `
            --api-key ${{ secrets.GITHUB_TOKEN }} `
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json `
            --no-symbols

  # ----------------------------------------------
  # Publish release
  # ----------------------------------------------
  publish-release:
    name: Publish Release
    needs: build-test-pack
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Push packages and symbols to NuGet.org
        shell: pwsh
        run: |
          Write-Host "Checking contents of artifacts folder"
          Get-ChildItem ./artifacts/*.nupkg -ErrorAction SilentlyContinue
          Get-ChildItem ./artifacts/*.snupkg -ErrorAction SilentlyContinue

          dotnet nuget push "artifacts\*.nupkg" `
            --api-key ${{ secrets.NUGET_API_KEY }} `
            --symbol-api-key ${{ secrets.NUGET_API_KEY }} `
            --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v${{ needs.build-test-pack.outputs.version }}
          release_name: v${{ needs.build-test-pack.outputs.version }}
          body: |
            ${{ github.event.inputs.release_notes }}
          draft: true
          prerelease: false

      - name: Upload packages to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assetPaths = @(
            Get-ChildItem ./artifacts -File |
              Where-Object { $_.Name.EndsWith('.nupkg') -or $_.Name.EndsWith('.snupkg') } |
              ForEach-Object { $_.FullName }
          )

          if ($assetPaths.Count -eq 0) {
            throw "No NuGet package assets were found."
          }

          & gh release upload "v${{ needs.build-test-pack.outputs.version }}" @assetPaths --clobber
