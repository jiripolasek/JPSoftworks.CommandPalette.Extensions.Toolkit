name: CI

on:
  pull_request:
    branches: [master, next]
  push:
    branches: [master, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  publish-ci:
    name: Publish CI packages to GitHub Packages
    needs: validate
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/next') &&
      github.repository == 'jiripolasek/JPSoftworks.CommandPalette.Extensions.Toolkit'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether CI publishing is allowed
        id: publish-policy
        shell: pwsh
        run: |
          Import-Module ./eng/Versioning.psm1 -Force
          $allowed = Test-ToolkitCiPublishAllowed
          "allowed=$($allowed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $allowed) {
            'Skipped GitHub Packages: the stable release for this numeric version is already tagged. CI packages remain available as workflow artifacts.' >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: ./.github/actions/setup-dotnet
        if: steps.publish-policy.outputs.allowed == 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.publish-policy.outputs.allowed == 'true'
        with:
          name: packages
          path: artifacts/packages
      - uses: ./.github/actions/prepare-publish
        id: upload
        if: steps.publish-policy.outputs.allowed == 'true'
        with:
          target: github
          version: ${{ needs.validate.outputs.version }}
      - name: Publish validated CI packages
        if: steps.publish-policy.outputs.allowed == 'true'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_PROGRESS_PATH: ${{ steps.upload.outputs.progress-path }}
        run: ./eng/publish-github.ps1 -Version $env:PACKAGE_VERSION -NoPack -ProgressPath $env:PUBLISH_PROGRESS_PATH -Confirm:$false
      - name: Save confirmed upload progress
        if: always() && steps.upload.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upload-github-progress-${{ github.run_attempt }}
          path: ${{ steps.upload.outputs.progress-path }}
          if-no-files-found: error
          retention-days: 30
